<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="calculator">
<meta name="theme-color" content="#ffffff">
<title>OpenCalculate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- top bar lol -->
<header class="top">
<strong>OpenCalculate</strong>
<div class="tr">
<button type="button" id="themeBtn">Theme</button>
<button type="button" id="histBtn">History</button>
</div>
</header>

<main>
<div class="wrap">
<div class="tabs">
<button type="button" class="tab on" data-mode="basic">Basic</button>
<button type="button" class="tab" data-mode="scientific">Scientific</button>
<button type="button" id="ang">DEG</button>
</div>

<div class="calc">
<div class="disp" id="disp">
<div class="expr" id="expr"></div>
<div class="val" id="val">0</div>
<div class="err" id="err" hidden></div>
</div>

<div class="pad" id="pad">
<!-- sci stuff -->
<div class="sci" id="sci" hidden>
<button type="button" class="btn" data-insert="sin(">sin</button>
<button type="button" class="btn" data-insert="cos(">cos</button>
<button type="button" class="btn" data-insert="tan(">tan</button>
<button type="button" class="btn" data-insert="asin(">asin</button>
<button type="button" class="btn" data-insert="acos(">acos</button>
<button type="button" class="btn" data-insert="atan(">atan</button>
<button type="button" class="btn" data-insert="ln(">ln</button>
<button type="button" class="btn" data-insert="log(">log</button>
<button type="button" class="btn" data-insert="sqrt(">√</button>
<button type="button" class="btn" data-action="square">x²</button>
<button type="button" class="btn" data-insert="^">xʸ</button>
<button type="button" class="btn" data-action="factorial">n!</button>
<button type="button" class="btn" data-insert="π">π</button>
<button type="button" class="btn" data-insert="e">e</button>
<button type="button" class="btn" data-insert="%">%</button>
</div>

<div class="nums">
<button type="button" class="btn" data-action="clear">AC</button>
<button type="button" class="btn" data-action="backspace">⌫</button>
<button type="button" class="btn" data-insert="(">(</button>
<button type="button" class="btn" data-insert=")">)</button>
<button type="button" class="btn" data-insert="7">7</button>
<button type="button" class="btn" data-insert="8">8</button>
<button type="button" class="btn" data-insert="9">9</button>
<button type="button" class="btn" data-insert="/">÷</button>
<button type="button" class="btn" data-insert="4">4</button>
<button type="button" class="btn" data-insert="5">5</button>
<button type="button" class="btn" data-insert="6">6</button>
<button type="button" class="btn" data-insert="*">×</button>
<button type="button" class="btn" data-insert="1">1</button>
<button type="button" class="btn" data-insert="2">2</button>
<button type="button" class="btn" data-insert="3">3</button>
<button type="button" class="btn" data-insert="-">−</button>
<button type="button" class="btn" data-insert="0">0</button>
<button type="button" class="btn" data-insert=".">.</button>
<button type="button" class="btn" data-insert="+">+</button>
<button type="button" class="btn eq" data-action="equals">=</button>
</div>
</div>
</div>

<p class="hint">try typing like 15 * 24 or sqrt(144) or 2^10</p>

<aside class="hist" id="hist" hidden>
<div class="hh">
<span>History</span>
<button type="button" id="histClr" disabled>Clear</button>
</div>
<p class="hn">only saved on your pc</p>
<ul class="hl" id="histList"></ul>
<p class="hemp" id="histEmpty">nothing yet</p>
</aside>
</div>
</main>

<script src="script.js"></script>
</body>
</html>
